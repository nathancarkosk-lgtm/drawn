name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /drawn/
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -a .vercel/output/static/. _site/
          cp _site/_shell.html _site/index.html
          cp _site/_shell.html _site/404.html
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          for name in ["index.html", "404.html", "_shell.html"]:
            p = Path("_site") / name
            t = p.read_bytes().decode("utf-8", "surrogateescape")
            for old, new in [
              ('href="/favicon.svg"', 'href="/drawn/favicon.svg"'),
              ('href="/__grok/', 'href="/drawn/__grok/'),
              ('src="/__grok/', 'src="/drawn/__grok/'),
            ]:
              t = t.replace(old, new)
            p.write_bytes(t.encode("utf-8", "surrogateescape"))
          PY
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
